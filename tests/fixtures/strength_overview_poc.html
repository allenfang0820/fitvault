                ]
            }
        }
    };
    const pocParams = new URLSearchParams(window.location.search);
    if (pocParams.get('mode') === 'unmapped') {
        const strength = mockRecord.detail.strength;
        strength.summary.unmapped_set_count = strength.summary.working_set_count;
        strength.muscle_heatmap.coverage = {
            working_sets: strength.summary.working_set_count,
            mapped_working_sets: 0,
            unmapped_working_sets: strength.summary.working_set_count,
            mapped_volume_share_pct: 0
        };
        strength.muscle_heatmap.regions = [];
        strength.exercises.forEach(function(exercise) {
            exercise.primary_muscles = [];
            exercise.secondary_muscles = [];
        });
    }
    document.getElementById('app').addEventListener('load', function() {
        const app = this.contentWindow;
        if (pocParams.get('library') === 'missing') app.BodyMuscles = null;
        app.document.getElementById('activity-detail-overlay').classList.add('open');
        app.renderActivityDetail(mockRecord);
        window.__strengthPocReady = true;
    });
</script>
</body>
