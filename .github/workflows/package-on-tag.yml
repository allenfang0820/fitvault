name: Package installers on release tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            node_runtime: darwin-arm64
          - arch: x86_64
            runner: macos-15-intel
            node_runtime: darwin-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated Python environment
        shell: bash
        run: python3 -m venv .venv312

      - name: Resolve release version from tag
        id: version
        shell: bash
        run: |
          VERSION="$(.venv312/bin/python scripts/release_version.py --tag "$GITHUB_REF_NAME")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build macOS installer
        shell: bash
        env:
          FITVAULT_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          scripts/prepare_node_runtime.sh "${{ matrix.node_runtime }}"
          PYTHON=.venv312/bin/python scripts/install_packaging_deps.sh
          .venv312/bin/python scripts/check_python312_runtime.py
          .venv312/bin/python -m packaging_diagnostics

          DIST_DIR="dist/release-macos-${{ matrix.arch }}"
          WORK_DIR="build/release-macos-${{ matrix.arch }}"
          RELEASE_DIR="release/macos-${{ matrix.arch }}"
          DMG_NAME="FitVault-V${FITVAULT_RELEASE_VERSION}-macOS-${{ matrix.arch }}.dmg"
          mkdir -p "$RELEASE_DIR"

          PYTHONPATH=. .venv312/bin/pyinstaller HikingTrackAnalyzer.spec \
            --noconfirm \
            --distpath "$DIST_DIR" \
            --workpath "$WORK_DIR"
          scripts/create_macos_dmg.sh "$DIST_DIR/脉图.app" "$RELEASE_DIR/$DMG_NAME" "脉图 FitVault"
          shasum -a 256 "$RELEASE_DIR/$DMG_NAME" | awk '{print $1 "  " $2}' \
            > "$RELEASE_DIR/$DMG_NAME.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitvault-macos-${{ matrix.arch }}
          path: release/macos-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0

  package-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Create isolated Python environment
        shell: pwsh
        run: python -m venv .venv312

      - name: Resolve release version from tag
        id: version
        shell: pwsh
        run: |
          $version = (& .\.venv312\Scripts\python.exe scripts\release_version.py --tag "${{ github.ref_name }}").Trim()
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows MSI
        shell: pwsh
        env:
          FITVAULT_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          .\scripts\prepare_node_runtime.ps1
          .\scripts\install_packaging_deps.ps1 -Python .\.venv312\Scripts\python.exe
          & .\.venv312\Scripts\python.exe scripts\check_python312_runtime.py
          if ($LASTEXITCODE -ne 0) {
            throw "Python runtime check failed with exit code $LASTEXITCODE"
          }
          & .\.venv312\Scripts\python.exe -m packaging_diagnostics
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging diagnostics failed with exit code $LASTEXITCODE"
          }

          $env:PYTHONPATH = "."
          $distDir = "dist\release-windows"
          $workDir = "build\release-windows"
          & .\.venv312\Scripts\pyinstaller.exe HikingTrackAnalyzer.spec --noconfirm --distpath $distDir --workpath $workDir
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed with exit code $LASTEXITCODE"
          }

          $publishDir = Join-Path $distDir "FitVault"
          if (-not (Test-Path (Join-Path $publishDir "FitVault.exe"))) {
            throw "PyInstaller Windows output is incomplete: $publishDir\FitVault.exe"
          }

          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $programFiles = [Environment]::GetEnvironmentVariable("ProgramFiles")
          $wixBinCandidates = @(
            (Join-Path $programFilesX86 "WiX Toolset v3.11\bin"),
            (Join-Path $programFilesX86 "WiX Toolset v3.14\bin"),
            (Join-Path $programFiles "WiX Toolset v3.11\bin"),
            (Join-Path $programFiles "WiX Toolset v3.14\bin")
          )
          $wixBin = $null
          foreach ($candidate in $wixBinCandidates) {
            if (Test-Path (Join-Path $candidate "heat.exe")) {
              $wixBin = $candidate
              break
            }
          }
          if (-not $wixBin) {
            $heatCmd = Get-Command heat.exe -ErrorAction SilentlyContinue
            if ($heatCmd) {
              $wixBin = Split-Path -Parent $heatCmd.Source
            }
          }
          if (-not $wixBin) {
            foreach ($candidate in $wixBinCandidates) {
              if (Test-Path (Join-Path $candidate "candle.exe")) {
                $wixBin = $candidate
                break
              }
            }
          }
          if (-not $wixBin) {
            Write-Host "WiX not found in common locations; attempting Chocolatey install."
            choco install wixtoolset --version=3.11.2 --no-progress --yes --allow-downgrade --force
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Chocolatey returned exit code $LASTEXITCODE; continuing WiX lookup."
            }
            foreach ($candidate in $wixBinCandidates) {
              if (Test-Path (Join-Path $candidate "heat.exe")) {
                $wixBin = $candidate
                break
              }
            }
            if (-not $wixBin) {
              $heatCmd = Get-Command heat.exe -ErrorAction SilentlyContinue
              if ($heatCmd) {
                $wixBin = Split-Path -Parent $heatCmd.Source
              }
            }
          }
          if (-not $wixBin) {
            Write-Host "ProgramFiles(x86)=$programFilesX86"
            Write-Host "ProgramFiles=$programFiles"
            Write-Host "PATH heat.exe lookup:"
            Get-Command heat.exe -ErrorAction SilentlyContinue | Format-List * | Out-String | Write-Host
            throw "Missing WiX tool: heat.exe (looked in standard locations and PATH)"
          }
          foreach ($tool in @("heat.exe", "candle.exe", "light.exe")) {
            if (-not (Test-Path (Join-Path $wixBin $tool))) {
              throw "Missing WiX tool: $tool in $wixBin"
            }
          }

          $wixWork = "build\wix"
          $harvestedFiles = Join-Path $wixWork "PublishedFiles.wxs"
          New-Item -ItemType Directory -Force -Path $wixWork, "release\windows-x64" | Out-Null
          & (Join-Path $wixBin "heat.exe") dir $publishDir -cg PublishedFiles -dr INSTALLFOLDER -ag -sfrag -srd -scom -sreg -var var.SourceDir -out $harvestedFiles
          if ($LASTEXITCODE -ne 0) {
            throw "WiX heat.exe failed with exit code $LASTEXITCODE"
          }
          & .\.venv312\Scripts\python.exe scripts\check_windows_msi_inputs.py --publish-dir $publishDir --wix-file installer\FitVault.wxs --wix-file $harvestedFiles
          if ($LASTEXITCODE -ne 0) {
            throw "Windows MSI input audit failed before candle/light"
          }
          & (Join-Path $wixBin "candle.exe") -nologo -arch x64 "-dProductVersion=$env:FITVAULT_RELEASE_VERSION" "-dSourceDir=$publishDir" -out "$wixWork\" installer\FitVault.wxs $harvestedFiles
          if ($LASTEXITCODE -ne 0) {
            throw "WiX candle.exe failed with exit code $LASTEXITCODE"
          }

          $msiName = "FitVault-V$env:FITVAULT_RELEASE_VERSION-Windows-x64.msi"
          $msiPath = Join-Path "release\windows-x64" $msiName
          & (Join-Path $wixBin "light.exe") -nologo -out $msiPath (Join-Path $wixWork "FitVault.wixobj") (Join-Path $wixWork "PublishedFiles.wixobj")
          if ($LASTEXITCODE -ne 0) {
            throw "WiX light.exe failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $msiPath)) {
            throw "WiX did not create MSI: $msiPath"
          }
          $msiItem = Get-Item $msiPath
          if ($msiItem.Length -lt 1048576) {
            throw "MSI is unexpectedly small: $($msiItem.Length) bytes at $msiPath"
          }
          $msiHeader = [System.IO.File]::ReadAllBytes((Resolve-Path $msiPath).Path)[0..7]
          $expectedHeader = [byte[]](0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)
          for ($i = 0; $i -lt $expectedHeader.Length; $i++) {
            if ($msiHeader[$i] -ne $expectedHeader[$i]) {
              throw "MSI file header is invalid at byte $i for $msiPath"
            }
          }

          $msiValidationDir = "build\msi-validation"
          $msiValidationLog = Join-Path $wixWork "msiexec-admin.log"
          if (Test-Path $msiValidationDir) {
            Remove-Item $msiValidationDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $msiValidationDir | Out-Null
          $msiFullPath = (Resolve-Path $msiPath).Path
          $validationTarget = (Resolve-Path $msiValidationDir).Path
          $msiArgs = @("/a", $msiFullPath, "/qn", "TARGETDIR=$validationTarget", "/l*v", $msiValidationLog)
          $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            if (Test-Path $msiValidationLog) {
              Get-Content $msiValidationLog -Tail 200
            }
            throw "Windows Installer administrative validation failed with exit code $($msiProcess.ExitCode)"
          }
          $validatedExe = Get-ChildItem -Path $msiValidationDir -Recurse -Filter "FitVault.exe" | Select-Object -First 1
          if (-not $validatedExe) {
            throw "Windows Installer validation did not extract FitVault.exe"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $msiPath).Hash.ToLowerInvariant()
          "$hash  $msiName" | Set-Content -Path "$msiPath.sha256" -Encoding ascii

      - name: Upload Windows packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fitvault-windows-packaging-diagnostics
          path: |
            build/wix/
            build/msi-validation/
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitvault-windows-x64
          path: release/windows-x64/
          if-no-files-found: error
          compression-level: 0
